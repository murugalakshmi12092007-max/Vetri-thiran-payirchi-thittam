<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComicCraft</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff3e0,#e3f2fd);margin:0;min-height:100vh}.box{max-width:720px;margin:50px auto;background:#fff;padding:35px;border-radius:18px;box-shadow:0 8px 30px #0002}h1{text-align:center}label{font-weight:bold;display:block;margin-top:15px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #ccc;border-radius:9px}textarea{min-height:110px}button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:10px;background:#222;color:#fff;font-size:16px;cursor:pointer}.error{background:#ffe0e0;padding:12px;border-radius:8px;color:#900}
</style></head>
<body><div class="box"><h1>📚 ComicCraft</h1><p>Create your own AI-powered 5-panel comic.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form action="/generate" method="post">
<label>Story Prompt</label><textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest"></textarea>
<label>Main Character Name</label><input name="character_name" required placeholder="Aria">
<label>Setting</label><select name="setting"><option>Forest</option><option>School</option><option>City</option><option>Space</option><option>Village</option></select>
<label>Story Tone</label><select name="tone"><option>Funny</option><option>Light-hearted</option><option>Dramatic</option><option>Adventure</option><option>Poetic</option></select>
<label>Art Style</label><select name="art_style"><option>Anime</option><option>Comic Book</option><option>Cartoon</option><option>Pixel Art</option><option>Realistic</option></select>
<button type="submit">✨ Generate Comic</button></form></div></body></html>
