<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Comic Preview</title>
<style>body{font-family:Arial;background:#f4f4f4;margin:0}.wrap{max-width:900px;margin:30px auto}.panel{background:#fff;margin:25px 0;padding:20px;border-radius:14px;box-shadow:0 4px 15px #0001}.panel img{width:100%;max-height:500px;object-fit:contain;background:#eee}.btn{display:inline-block;padding:12px 18px;background:#222;color:#fff;text-decoration:none;border-radius:8px;margin:8px 0}.scene{font-style:italic;color:#555}</style></head>
<body><div class="wrap"><h1>🎨 Your Comic</h1><a class="btn" href="{{ pdf_path }}" download>Download Your Comic as PDF</a>
{% for panel in layout %}<div class="panel"><h2>Panel {{ panel.panel_number }}: {{ panel.title }}</h2>{% if panel.image_path %}<img src="{{ panel.image_path }}" alt="Comic panel">{% endif %}<p class="scene">{{ panel.scene_description }}</p><div>{{ panel.text | replace('\n','<br>') | safe }}</div></div>{% endfor %}
<a class="btn" href="/">Create Another Comic</a></div></body></html>
